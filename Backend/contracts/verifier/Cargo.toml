[package]
name    = "zkcred-verifier"
version = "0.1.0"
edition = "2021"
description = "zkCred on-chain Groth16 verifier using Stellar BLS12-381 host functions"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

# ── Release profile (required for Soroban WASM size constraints) ────────────
[profile.release]
opt-level      = "z"
overflow-checks = true
debug          = 0
strip          = "symbols"
debug-assertions = false
panic          = "abort"
codegen-units  = 1
lto            = true

[profile.release-with-logs]
inherits         = "release"
debug-assertions = true
